<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Apex Bank Management System</title>
  <!-- FontAwesome & CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-brand">
      <div class="logo-icon">
        <i class="fas fa-university"></i>
      </div>
      <h3>Apex Bank Portal</h3>
      <p>Secure Enterprise Bank Management System</p>
    </div>

    <!-- Quick Demo Credentials -->
    <div class="demo-credentials-box">
      <p><i class="fas fa-key"></i> <strong>Quick Demo Shortcuts:</strong></p>
      <div style="display: flex; gap: 0.5rem; margin-top: 0.35rem;">
        <span class="quick-demo-btn" id="fillAdminDemo"><i class="fas fa-user-shield"></i> Admin Demo</span>
        <span class="quick-demo-btn" id="fillCustomerDemo"><i class="fas fa-user"></i> Customer Demo</span>
      </div>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label" for="loginEmail">Email Address</label>
        <div class="input-icon-group">
          <i class="fas fa-envelope"></i>
          <input type="email" id="loginEmail" class="form-control" placeholder="name@bank.com" required>
        </div>
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
          <label class="form-label" for="loginPassword" style="margin-bottom: 0;">Password</label>
          <a href="#" onclick="showToast('Password Reset', 'Reset link sent to your registered email.', 'info')" style="font-size: 0.78rem;">Forgot Password?</a>
        </div>
        <div class="input-icon-group">
          <i class="fas fa-lock"></i>
          <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
        </div>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; font-size: 0.825rem;">
        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
          <input type="checkbox" checked> Remember this device
        </label>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem;">
        Sign In to Portal <i class="fas fa-arrow-right"></i>
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-muted);">
      Don't have an account? <a href="register.html" style="font-weight: 700;">Open New Account</a>
    </div>
  </div>

  <script src="assets/js/db.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
